<div class="login-container">
  <h2>Iniciar sesión</h2>

  <form [formGroup]="form" (ngSubmit)="login()">
    <div class="campo">
      <label for="email">Correo</label>
      <input type="email" id="email" formControlName="email" />
    </div>

    <div class="campo">
      <label for="pwd">Contraseña</label>
      <input type="password" id="pwd" formControlName="pwd" />
    </div>

    <button type="submit" [disabled]="cargando">Entrar</button>

    @if (mensajeError) {
      <p class="error">{{ mensajeError }}</p>
    }
  </form>

  <p><a routerLink="/recuperar">¿Has olvidado tu contraseña?</a></p>
  <p>¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
</div>
