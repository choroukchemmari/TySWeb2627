<div class="login-container">
  <h2>Nueva contraseña</h2>

  @if (enlaceInvalido) {
    <p class="error">El enlace no es válido o ha caducado.</p>
    <p><a routerLink="/recuperar">Solicitar un enlace nuevo</a></p>
  } @else if (cambiada) {
    <p class="exito">Tu contraseña se ha cambiado correctamente.</p>
    <p><a routerLink="/login">Ir al login</a></p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="cambiar()">
      <div class="campo">
        <label for="password">Nueva contraseña</label>
        <input type="password" id="password" formControlName="password" />
      </div>

      <div class="campo">
        <label for="confirmacion">Confirmar contraseña</label>
        <input type="password" id="confirmacion" formControlName="confirmacion" />
      </div>

      <button type="submit" [disabled]="cargando">Cambiar contraseña</button>

      @if (mensajeError) {
        <p class="error">{{ mensajeError }}</p>
      }
    </form>
  }
</div>
