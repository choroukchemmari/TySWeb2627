<h1>Opciones</h1>

<ol>
    <li (click)="select(1)"><u>Crear vehículos</u></li>
    <li (click)="select(2)">Ubicar estaciones</li>
    <li (click)="select(3)">Gestionar estación</li>
    <li (click)="select(4)">Gestionar vehículos</li>
    <li (click)="select(5)"><u>Gestionar tráfico</u></li>
    <li (click)="select(6)">Registro</li>
</ol>

@if (selectedOption==1) {
<app-crear-vehiculos></app-crear-vehiculos>
}

@if (selectedOption==5) {
<app-mapa></app-mapa>
}

@if (selectedOption==6) {
<app-registro></app-registro>
}
